name: ETH HAI ER-008 close and direct-register freeze

'on':
  push:
    branches:
      - eth-hai-direct-freeze-20260826
    paths:
      - .github/workflows/eth-hai-er008-freeze.yml
      - eth_hai_er008/**
      - eth_hai_schema_gate/**
      - eth_hai_repro/**

permissions:
  contents: read
  actions: read

concurrency:
  group: eth-hai-er008-freeze
  cancel-in-progress: true

jobs:
  verify-er008:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    env:
      PINNED_REPOSITORY: RichardHGL/CHI2023_DKE
      PINNED_COMMIT: 008f9833ab8c4c23ed94908e0108053a2240a100
      PINNED_ROOT_TREE: 2ba7a4f41807de9a32670f77d55598fabcb253d9
      SOURCE_DIR: work/vendor/CHI2023_DKE
      VENV_DIR: work/python-3.8.16-er008
      RESULTS_DIR: work/er008_results
      PYTHONHASHSEED: '0'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
      TZ: UTC
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      OUTDATED_IGNORE: '1'
      MPLBACKEND: Agg

    steps:
      - name: Check out private freeze branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1

      - name: Create private detached-HEAD source checkout
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$SOURCE_DIR")" "$RESULTS_DIR/source" "$RESULTS_DIR/primary" "$RESULTS_DIR/repeat"
          git clone --no-checkout "https://github.com/${PINNED_REPOSITORY}.git" "$SOURCE_DIR"
          git -C "$SOURCE_DIR" fetch origin "$PINNED_COMMIT"
          git -C "$SOURCE_DIR" checkout --detach "$PINNED_COMMIT"
          test "$(git -C "$SOURCE_DIR" rev-parse HEAD)" = "$PINNED_COMMIT"
          test "$(git -C "$SOURCE_DIR" rev-parse 'HEAD^{tree}')" = "$PINNED_ROOT_TREE"
          if git -C "$SOURCE_DIR" symbolic-ref -q HEAD; then exit 1; fi
          test -z "$(git -C "$SOURCE_DIR" status --porcelain=v1 --untracked-files=all)"

      - name: Reverify complete 27-object source snapshot
        shell: bash
        run: |
          set -euo pipefail
          python3 eth_hai_repro/verify_source_snapshot.py \
            --repo "$SOURCE_DIR" \
            --manifest eth_hai_repro/git_object_snapshot_verified.json \
            --output-dir "$RESULTS_DIR/source"
          cp eth_hai_repro/git_object_snapshot_verified.json "$RESULTS_DIR/source/"

      - name: Set up exact Python 3.8.16 runtime
        uses: actions/setup-python@v5
        with:
          python-version: 3.8.16
          architecture: x64

      - name: Recreate and verify frozen analysis environment
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$VENV_DIR"
          source "$VENV_DIR/bin/activate"
          python -m pip install --disable-pip-version-check --no-input \
            pip==23.0.1 setuptools==67.1.0 wheel==0.38.4
          python -m pip install --disable-pip-version-check --no-input --no-deps \
            -r eth_hai_schema_gate/requirements-analysis-stack-33005830882.txt
          python -m pip check > "$RESULTS_DIR/pip-check.txt"
          python -m pip freeze --all | sort > "$RESULTS_DIR/requirements-freeze-observed.txt"
          diff -u eth_hai_schema_gate/requirements-freeze-expected-33005830882.txt \
            "$RESULTS_DIR/requirements-freeze-observed.txt" > "$RESULTS_DIR/environment-freeze-diff.txt"

      - name: Verify ER-008 twice
        shell: bash
        run: |
          set -euo pipefail
          source "$VENV_DIR/bin/activate"
          sha256sum eth_hai_er008/verify_ai_batch_balance.py > "$RESULTS_DIR/verifier-sha256.txt"
          python eth_hai_er008/verify_ai_batch_balance.py --repo "$SOURCE_DIR" --out "$RESULTS_DIR/primary" \
            > "$RESULTS_DIR/primary/stdout.txt" 2> "$RESULTS_DIR/primary/stderr.txt"
          python eth_hai_er008/verify_ai_batch_balance.py --repo "$SOURCE_DIR" --out "$RESULTS_DIR/repeat" \
            > "$RESULTS_DIR/repeat/stdout.txt" 2> "$RESULTS_DIR/repeat/stderr.txt"

      - name: Enforce deterministic PASS and clean source
        shell: bash
        run: |
          set -euo pipefail
          diff -u "$RESULTS_DIR/primary/er008_task_order_crosswalk.tsv" \
            "$RESULTS_DIR/repeat/er008_task_order_crosswalk.tsv" > "$RESULTS_DIR/task-order-repeat-diff.txt"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['RESULTS_DIR'])
          data = json.loads((root/'primary'/'er008_verification.json').read_text())
          assert data['all_orders_pass'] is True
          assert data['task_order_count'] == 10
          assert data['expected_ai_correct_per_experimental_batch'] == 4
          assert all(row['first_batch_ai_correct'] == 4 for row in data['rows'])
          assert all(row['second_batch_ai_correct'] == 4 for row in data['rows'])
          assert data['participant_level_data_read'] is False
          assert data['participant_level_data_emitted'] is False
          repeat = json.loads((root/'repeat'/'er008_verification.json').read_text())
          for item in ('generated_at_utc',):
              data.pop(item, None); repeat.pop(item, None)
          assert data == repeat
          PY
          git -C "$SOURCE_DIR" status --porcelain=v1 --untracked-files=all > "$RESULTS_DIR/source/source-post-er008-status.txt"
          test ! -s "$RESULTS_DIR/source/source-post-er008-status.txt"

      - name: Record provenance and integrity
        shell: bash
        run: |
          set -euo pipefail
          cp .github/workflows/eth-hai-er008-freeze.yml "$RESULTS_DIR/workflow.yml"
          cp eth_hai_er008/verify_ai_batch_balance.py "$RESULTS_DIR/verifier.py"
          python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          root = Path(os.environ['RESULTS_DIR'])
          metadata = {
              'schema_version':'1.0',
              'captured_at_utc':datetime.now(timezone.utc).isoformat(),
              'github_repository':os.environ['GITHUB_REPOSITORY'],
              'github_ref_name':os.environ['GITHUB_REF_NAME'],
              'github_orchestration_commit':os.environ['GITHUB_SHA'],
              'github_run_id':int(os.environ['GITHUB_RUN_ID']),
              'upstream_repository':os.environ['PINNED_REPOSITORY'],
              'upstream_commit':os.environ['PINNED_COMMIT'],
              'upstream_root_tree':os.environ['PINNED_ROOT_TREE'],
              'source_checkout_detached_head':True,
              'source_objects_verified':27,
              'python_runtime':'3.8.16',
              'frozen_environment_reused_exactly':True,
              'er008_status':'Exact',
              'task_orders_verified':10,
              'ai_correct_per_first_batch':4,
              'ai_correct_per_second_batch':4,
              'repeat_aggregate_output_identical':True,
              'participant_level_data_read':False,
              'participant_level_data_in_artifact':False,
          }
          (root/'run-metadata.json').write_text(json.dumps(metadata, indent=2, sort_keys=True)+'\n', encoding='utf-8')
          (root/'GATE_STATUS.md').write_text(
              '# ETH HAI ER-008 Closure\n\n'
              '- Pinned detached-HEAD source verification: **PASS**\n'
              '- Exact frozen Python 3.8.16 environment: **PASS**\n'
              '- Ten released task orders checked: **PASS**\n'
              '- AI correct on four of six first-batch tasks in every order: **PASS**\n'
              '- AI correct on four of six second-batch tasks in every order: **PASS**\n'
              '- ER-008 classification: **EXACT**\n'
              '- Participant-level data read or emitted: **NO**\n',
              encoding='utf-8'
          )
          PY
          find "$RESULTS_DIR" -type f ! -name RESULTS_MANIFEST.sha256 -print0 \
            | sort -z | xargs -0 sha256sum > "$RESULTS_DIR/RESULTS_MANIFEST.sha256"

      - name: Upload ER-008 closure artifact
        uses: actions/upload-artifact@v4
        with:
          name: eth-hai-er008-freeze-${{ github.run_id }}
          path: work/er008_results
          if-no-files-found: error
          retention-days: 30
          compression-level: 9
