name: ETH HAI foundation robustness RB-01 through RB-05

'on':
  push:
    branches:
      - eth-hai-clean-reimplementation-20260827
    paths:
      - .github/workflows/eth-hai-foundation-robustness.yml
      - eth_hai_clean/run_foundation_robustness.py
      - eth_hai_clean/core.py
      - eth_hai_clean/ROBUSTNESS_AUDIT_PLAN.md
      - eth_hai_schema_gate/**
      - eth_hai_repro/**

permissions:
  contents: read
  actions: read

concurrency:
  group: eth-hai-foundation-robustness
  cancel-in-progress: true

jobs:
  foundation-robustness:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    env:
      PINNED_REPOSITORY: RichardHGL/CHI2023_DKE
      PINNED_COMMIT: 008f9833ab8c4c23ed94908e0108053a2240a100
      PINNED_ROOT_TREE: 2ba7a4f41807de9a32670f77d55598fabcb253d9
      SOURCE_DIR: work/vendor/CHI2023_DKE
      VENV_DIR: work/python-3.8.16-foundation
      RESULTS_DIR: work/foundation_robustness_results
      PYTHONHASHSEED: '0'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
      TZ: UTC
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      OUTDATED_IGNORE: '1'
      MPLBACKEND: Agg

    steps:
      - name: Check out private clean branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1

      - name: Create private detached-HEAD source checkout
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$SOURCE_DIR")" "$RESULTS_DIR/source" "$RESULTS_DIR/primary" "$RESULTS_DIR/repeat"
          git clone --no-checkout "https://github.com/${PINNED_REPOSITORY}.git" "$SOURCE_DIR"
          git -C "$SOURCE_DIR" fetch origin "$PINNED_COMMIT"
          git -C "$SOURCE_DIR" checkout --detach "$PINNED_COMMIT"
          test "$(git -C "$SOURCE_DIR" rev-parse HEAD)" = "$PINNED_COMMIT"
          test "$(git -C "$SOURCE_DIR" rev-parse 'HEAD^{tree}')" = "$PINNED_ROOT_TREE"
          if git -C "$SOURCE_DIR" symbolic-ref -q HEAD; then exit 1; fi
          test -z "$(git -C "$SOURCE_DIR" status --porcelain=v1 --untracked-files=all)"

      - name: Reverify complete 27-object source snapshot
        shell: bash
        run: |
          set -euo pipefail
          python3 eth_hai_repro/verify_source_snapshot.py \
            --repo "$SOURCE_DIR" \
            --manifest eth_hai_repro/git_object_snapshot_verified.json \
            --output-dir "$RESULTS_DIR/source"
          cp eth_hai_repro/git_object_snapshot_verified.json "$RESULTS_DIR/source/"

      - name: Set up exact Python 3.8.16 runtime
        uses: actions/setup-python@v5
        with:
          python-version: 3.8.16
          architecture: x64

      - name: Recreate and verify frozen analysis environment
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$VENV_DIR"
          source "$VENV_DIR/bin/activate"
          python -m pip install --disable-pip-version-check --no-input \
            pip==23.0.1 setuptools==67.1.0 wheel==0.38.4
          python -m pip install --disable-pip-version-check --no-input --no-deps \
            -r eth_hai_schema_gate/requirements-analysis-stack-33005830882.txt
          python -m pip check > "$RESULTS_DIR/pip-check.txt"
          python -m pip freeze --all | sort > "$RESULTS_DIR/requirements-freeze-observed.txt"
          diff -u eth_hai_schema_gate/requirements-freeze-expected-33005830882.txt \
            "$RESULTS_DIR/requirements-freeze-observed.txt" > "$RESULTS_DIR/environment-freeze-diff.txt"

      - name: Execute RB-01 through RB-05 twice
        shell: bash
        run: |
          set -euo pipefail
          source "$VENV_DIR/bin/activate"
          sha256sum eth_hai_clean/core.py eth_hai_clean/run_foundation_robustness.py \
            > "$RESULTS_DIR/foundation-source-sha256.txt"
          sha256sum "$SOURCE_DIR/data_analysis/normal_distribution_analysis.py" \
            "$SOURCE_DIR/data_analysis/util.py" \
            > "$RESULTS_DIR/audited-upstream-source-sha256.txt"
          PYTHONPATH="$GITHUB_WORKSPACE" python eth_hai_clean/run_foundation_robustness.py \
            --repo "$SOURCE_DIR" --out "$RESULTS_DIR/primary" \
            > "$RESULTS_DIR/primary/stdout.txt" 2> "$RESULTS_DIR/primary/stderr.txt"
          PYTHONPATH="$GITHUB_WORKSPACE" python eth_hai_clean/run_foundation_robustness.py \
            --repo "$SOURCE_DIR" --out "$RESULTS_DIR/repeat" --no-plots \
            > "$RESULTS_DIR/repeat/stdout.txt" 2> "$RESULTS_DIR/repeat/stderr.txt"

      - name: Enforce determinism and aggregate-only boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['RESULTS_DIR'])
          p = root / 'primary'
          r = root / 'repeat'
          names = [
              'FOUNDATION_STATUS.md',
              'foundation_robustness_summary.json',
              'rb01_tutorial_coding.tsv', 'rb01_coding_decision_memo.json',
              'rb02_analysis_specific_missingness.tsv', 'rb02_column_missingness.tsv', 'rb02_missingness_memo.json',
              'rb03_ratio_policy_descriptives.tsv', 'rb03_condition_means.tsv', 'rb03_group_tests.tsv',
              'rb03_correlations.tsv', 'rb03_ratio_policy_memo.json',
              'rb04_sd_conventions.tsv', 'rb04_sd_memo.json',
              'rb05_distribution_diagnostics.tsv', 'rb05_normality_memo.json',
          ]
          for name in names:
              left = (p/name).read_bytes()
              right = (r/name).read_bytes()
              if left != right:
                  raise AssertionError('Non-deterministic output: ' + name)
          data = json.loads((p/'foundation_robustness_summary.json').read_text(encoding='utf-8'))
          assert data['passed'] is True
          assert data['sample_n'] == 249
          assert data['upstream_util_imported'] is False
          assert data['participant_level_data_emitted'] is False
          assert data['key_findings']['released_tutorial_mapping_reconciled'] is True
          assert data['key_findings']['analysis_specific_missingness_delta_max_abs'] == 0
          assert set(data['classifications']) == {'RB-01','RB-02','RB-03','RB-04','RB-05'}
          all_text = '\n'.join(
              path.read_text(encoding='utf-8', errors='ignore')
              for path in root.rglob('*') if path.is_file() and path.suffix.lower() not in {'.png'}
          )
          assert 'Participant_' not in all_text
          PY
          git -C "$SOURCE_DIR" status --porcelain=v1 --untracked-files=all > "$RESULTS_DIR/source/source-post-foundation-status.txt"
          test ! -s "$RESULTS_DIR/source/source-post-foundation-status.txt"

      - name: Record foundation provenance and integrity
        shell: bash
        run: |
          set -euo pipefail
          cp .github/workflows/eth-hai-foundation-robustness.yml "$RESULTS_DIR/workflow.yml"
          cp eth_hai_clean/core.py "$RESULTS_DIR/core.py"
          cp eth_hai_clean/run_foundation_robustness.py "$RESULTS_DIR/run_foundation_robustness.py"
          cp eth_hai_clean/ROBUSTNESS_AUDIT_PLAN.md "$RESULTS_DIR/ROBUSTNESS_AUDIT_PLAN.md"
          python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          root = Path(os.environ['RESULTS_DIR'])
          metadata = {
              'schema_version':'1.0',
              'captured_at_utc':datetime.now(timezone.utc).isoformat(),
              'github_repository':os.environ['GITHUB_REPOSITORY'],
              'github_ref_name':os.environ['GITHUB_REF_NAME'],
              'github_orchestration_commit':os.environ['GITHUB_SHA'],
              'github_run_id':int(os.environ['GITHUB_RUN_ID']),
              'upstream_repository':os.environ['PINNED_REPOSITORY'],
              'upstream_commit':os.environ['PINNED_COMMIT'],
              'upstream_root_tree':os.environ['PINNED_ROOT_TREE'],
              'python_runtime':'3.8.16',
              'frozen_environment_reused_exactly':True,
              'foundation_robustness_gate':'PASS',
              'checks_executed':['RB-01','RB-02','RB-03','RB-04','RB-05'],
              'upstream_util_imported':False,
              'repeat_aggregate_outputs_identical':True,
              'participant_level_data_in_artifact':False,
          }
          (root/'run-metadata.json').write_text(json.dumps(metadata, indent=2, sort_keys=True)+'\n', encoding='utf-8')
          PY
          find "$RESULTS_DIR" -type f ! -name RESULTS_MANIFEST.sha256 -print0 \
            | sort -z | xargs -0 sha256sum > "$RESULTS_DIR/RESULTS_MANIFEST.sha256"

      - name: Upload aggregate foundation robustness artifact
        uses: actions/upload-artifact@v4
        with:
          name: eth-hai-foundation-robustness-${{ github.run_id }}
          path: work/foundation_robustness_results
          if-no-files-found: error
          retention-days: 30
          compression-level: 9
