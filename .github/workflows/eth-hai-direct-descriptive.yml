name: ETH HAI direct descriptive reproduction

'on':
  push:
    branches:
      - eth-hai-direct-descriptive-20260826
    paths:
      - .github/workflows/eth-hai-direct-descriptive.yml
      - eth_hai_descriptive_repro/**
      - eth_hai_schema_gate/**
      - eth_hai_repro/**

permissions:
  contents: read
  actions: read

concurrency:
  group: eth-hai-direct-descriptive-reproduction
  cancel-in-progress: true

jobs:
  direct-descriptive:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      PINNED_REPOSITORY: RichardHGL/CHI2023_DKE
      PINNED_COMMIT: 008f9833ab8c4c23ed94908e0108053a2240a100
      PINNED_ROOT_TREE: 2ba7a4f41807de9a32670f77d55598fabcb253d9
      SOURCE_DIR: work/vendor/CHI2023_DKE
      VENV_DIR: work/python-3.8.16-direct-descriptive
      RESULTS_DIR: work/direct_descriptive_results
      PYTHONHASHSEED: '0'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
      TZ: UTC
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      OUTDATED_IGNORE: '1'
      MPLBACKEND: Agg

    steps:
      - name: Check out private direct-reproduction branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1

      - name: Create private detached-HEAD source checkout
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$SOURCE_DIR")" "$RESULTS_DIR/source"
          git clone --no-checkout "https://github.com/${PINNED_REPOSITORY}.git" "$SOURCE_DIR"
          git -C "$SOURCE_DIR" fetch origin "$PINNED_COMMIT"
          git -C "$SOURCE_DIR" checkout --detach "$PINNED_COMMIT"
          test "$(git -C "$SOURCE_DIR" rev-parse HEAD)" = "$PINNED_COMMIT"
          test "$(git -C "$SOURCE_DIR" rev-parse 'HEAD^{tree}')" = "$PINNED_ROOT_TREE"
          if git -C "$SOURCE_DIR" symbolic-ref -q HEAD; then
            echo 'ERROR: source checkout is not detached' >&2
            exit 1
          fi
          test -z "$(git -C "$SOURCE_DIR" status --porcelain=v1 --untracked-files=all)"

      - name: Reverify complete 27-object source snapshot
        shell: bash
        run: |
          set -euo pipefail
          python3 eth_hai_repro/verify_source_snapshot.py \
            --repo "$SOURCE_DIR" \
            --manifest eth_hai_repro/git_object_snapshot_verified.json \
            --output-dir "$RESULTS_DIR/source"
          cp eth_hai_repro/git_object_snapshot_verified.json "$RESULTS_DIR/source/"

      - name: Set up exact Python 3.8.16 runtime
        uses: actions/setup-python@v5
        with:
          python-version: 3.8.16
          architecture: x64

      - name: Recreate and verify the frozen analysis environment
        shell: bash
        run: |
          set -euo pipefail
          python --version | tee "$RESULTS_DIR/setup-python-version.txt"
          python -m venv "$VENV_DIR"
          source "$VENV_DIR/bin/activate"
          python -m pip install --disable-pip-version-check --no-input \
            pip==23.0.1 setuptools==67.1.0 wheel==0.38.4
          python -m pip install --disable-pip-version-check --no-input --no-deps \
            -r eth_hai_schema_gate/requirements-analysis-stack-33005830882.txt
          python -m pip check | tee "$RESULTS_DIR/pip-check.txt"
          python -m pip freeze --all | sort > "$RESULTS_DIR/requirements-freeze-observed.txt"
          diff -u \
            eth_hai_schema_gate/requirements-freeze-expected-33005830882.txt \
            "$RESULTS_DIR/requirements-freeze-observed.txt" \
            > "$RESULTS_DIR/environment-freeze-diff.txt"
          cp eth_hai_schema_gate/requirements-analysis-stack-33005830882.txt "$RESULTS_DIR/"
          cp eth_hai_schema_gate/requirements-freeze-expected-33005830882.txt "$RESULTS_DIR/"
          python -m pip list --format=json > "$RESULTS_DIR/pip-list.json"

      - name: Execute original descriptive scripts without source edits
        shell: bash
        run: |
          set -euo pipefail
          source "$VENV_DIR/bin/activate"
          export PYTHONPATH="$GITHUB_WORKSPACE/eth_hai_descriptive_repro"
          mkdir -p "$RESULTS_DIR/runs" work/mplconfig

          run_script() {
            local script="$1"
            local expected="$2"
            local stem="${script%.py}"
            local outdir="$RESULTS_DIR/runs/$stem"
            local started ended rc figure_count
            mkdir -p "$outdir/figures"
            sha256sum "$SOURCE_DIR/data_analysis/$script" > "$outdir/source-script-sha256.txt"
            printf '%s\n' "python $script" > "$outdir/command.txt"
            printf '%s\n' "$SOURCE_DIR/data_analysis" > "$outdir/working-directory.txt"
            started="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            set +e
            (
              cd "$SOURCE_DIR/data_analysis"
              FIGURE_CAPTURE_DIR="$GITHUB_WORKSPACE/$outdir/figures" \
              FIGURE_CAPTURE_PREFIX="$stem" \
              MPLCONFIGDIR="$GITHUB_WORKSPACE/work/mplconfig/$stem" \
              python "$script"
            ) > "$outdir/stdout.txt" 2> "$outdir/stderr.txt"
            rc=$?
            set -e
            ended="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            printf '%s\n' "$rc" > "$outdir/exit-code.txt"
            figure_count="$(find "$outdir/figures" -maxdepth 1 -type f -name '*.png' | wc -l | tr -d ' ')"
            python3 - "$outdir" "$script" "$expected" "$started" "$ended" "$rc" "$figure_count" <<'PY'
          import json, sys
          from pathlib import Path
          outdir, script, expected, started, ended, rc, figures = sys.argv[1:]
          payload = {
              'schema_version': '1.0',
              'script': script,
              'expected_execution_outcome': expected,
              'started_at_utc': started,
              'ended_at_utc': ended,
              'exit_code': int(rc),
              'captured_png_figures': int(figures),
              'upstream_script_edited': False,
              'figure_capture_instrumentation': True,
              'statistical_specification_modified': False,
          }
          Path(outdir, 'run-metadata.json').write_text(
              json.dumps(payload, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          PY
          }

          run_script descriptive_statistics_new.py success
          run_script explanation_usefulness.py success
          run_script normal_distribution_analysis.py historical_success_with_known_methodological_flags
          run_script analysis_time_new.py expected_not_testable_missing_demographic_csv

      - name: Enforce expected direct-run outcomes
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat "$RESULTS_DIR/runs/descriptive_statistics_new/exit-code.txt")" = '0'
          test "$(cat "$RESULTS_DIR/runs/explanation_usefulness/exit-code.txt")" = '0'
          test "$(cat "$RESULTS_DIR/runs/normal_distribution_analysis/exit-code.txt")" = '0'
          test "$(cat "$RESULTS_DIR/runs/analysis_time_new/exit-code.txt")" != '0'
          test "$(find "$RESULTS_DIR/runs/descriptive_statistics_new/figures" -name '*.png' | wc -l | tr -d ' ')" = '2'
          test "$(find "$RESULTS_DIR/runs/explanation_usefulness/figures" -name '*.png' | wc -l | tr -d ' ')" = '1'
          grep -q 'demographic.csv' "$RESULTS_DIR/runs/analysis_time_new/stderr.txt"
          grep -q 'FileNotFoundError' "$RESULTS_DIR/runs/analysis_time_new/stderr.txt"
          git -C "$SOURCE_DIR" status --porcelain=v1 --untracked-files=all \
            > "$RESULTS_DIR/source/source-post-runs-status.txt"
          test ! -s "$RESULTS_DIR/source/source-post-runs-status.txt"

      - name: Record pre-hypothesis execution boundary and integrity
        shell: bash
        run: |
          set -euo pipefail
          cp eth_hai_descriptive_repro/sitecustomize.py "$RESULTS_DIR/figure-capture-sitecustomize.py"
          cp .github/workflows/eth-hai-direct-descriptive.yml "$RESULTS_DIR/workflow.yml"
          python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path

          results = Path(os.environ['RESULTS_DIR'])
          metadata = {
              'schema_version': '1.0',
              'captured_at_utc': datetime.now(timezone.utc).isoformat(),
              'github_repository': os.environ['GITHUB_REPOSITORY'],
              'github_ref_name': os.environ['GITHUB_REF_NAME'],
              'github_orchestration_commit': os.environ['GITHUB_SHA'],
              'github_run_id': int(os.environ['GITHUB_RUN_ID']),
              'github_run_attempt': int(os.environ['GITHUB_RUN_ATTEMPT']),
              'upstream_repository': os.environ['PINNED_REPOSITORY'],
              'upstream_commit': os.environ['PINNED_COMMIT'],
              'upstream_root_tree': os.environ['PINNED_ROOT_TREE'],
              'source_checkout_detached_head': True,
              'source_objects_verified': 27,
              'python_runtime': '3.8.16',
              'frozen_environment_reused_exactly': True,
              'original_descriptive_scripts_executed': [
                  'descriptive_statistics_new.py',
                  'explanation_usefulness.py',
                  'normal_distribution_analysis.py',
                  'analysis_time_new.py',
              ],
              'hypothesis_scripts_executed': False,
              'participant_level_data_in_artifact': False,
              'upstream_source_files_modified': False,
              'analysis_time_status': 'not testable: demographic.csv absent',
          }
          (results / 'run-metadata.json').write_text(
              json.dumps(metadata, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          (results / 'GATE_STATUS.md').write_text(
              '# ETH HAI Direct Descriptive Reproduction\n\n'
              '- Pinned detached-HEAD source verification: **PASS**\n'
              '- Exact frozen Python 3.8.16 environment: **PASS**\n'
              '- `descriptive_statistics_new.py`: **EXECUTED, exit 0**\n'
              '- `explanation_usefulness.py`: **EXECUTED, exit 0**\n'
              '- `normal_distribution_analysis.py`: **EXECUTED, exit 0; historical result only**\n'
              '- `analysis_time_new.py`: **NOT TESTABLE; expected missing `demographic.csv` failure captured**\n'
              '- Upstream scripts edited: **NO**\n'
              '- H1-H4 or other hypothesis scripts executed: **NO**\n'
              '- Participant-level data included in artifact: **NO**\n',
              encoding='utf-8',
          )
          PY
          find "$RESULTS_DIR" -type f ! -name RESULTS_MANIFEST.sha256 -print0 \
            | sort -z | xargs -0 sha256sum \
            > "$RESULTS_DIR/RESULTS_MANIFEST.sha256"

      - name: Upload aggregate direct-reproduction artifact
        uses: actions/upload-artifact@v4
        with:
          name: eth-hai-direct-descriptive-${{ github.run_id }}
          path: work/direct_descriptive_results
          if-no-files-found: error
          retention-days: 30
          compression-level: 9
