name: ETH HAI H3 display-expanded reproduction

'on':
  push:
    branches:
      - eth-hai-direct-h3-20260826
    paths:
      - .github/workflows/eth-hai-direct-h3-display.yml
      - eth_hai_h3_display/**
      - eth_hai_schema_gate/**
      - eth_hai_repro/**

permissions:
  contents: read
  actions: read

concurrency:
  group: eth-hai-h3-display-expanded
  cancel-in-progress: true

jobs:
  h3-display-expanded:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    env:
      PINNED_REPOSITORY: RichardHGL/CHI2023_DKE
      PINNED_COMMIT: 008f9833ab8c4c23ed94908e0108053a2240a100
      PINNED_ROOT_TREE: 2ba7a4f41807de9a32670f77d55598fabcb253d9
      SOURCE_DIR: work/vendor/CHI2023_DKE
      VENV_DIR: work/python-3.8.16-h3-display
      RESULTS_DIR: work/h3_display_results
      PYTHONHASHSEED: '0'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
      TZ: UTC
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      OUTDATED_IGNORE: '1'
      MPLBACKEND: Agg

    steps:
      - name: Check out private H3 branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1

      - name: Create and verify private detached-HEAD checkout
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$SOURCE_DIR")" "$RESULTS_DIR/source" "$RESULTS_DIR/runs/analysis_H3_new"
          git clone --no-checkout "https://github.com/${PINNED_REPOSITORY}.git" "$SOURCE_DIR"
          git -C "$SOURCE_DIR" fetch origin "$PINNED_COMMIT"
          git -C "$SOURCE_DIR" checkout --detach "$PINNED_COMMIT"
          test "$(git -C "$SOURCE_DIR" rev-parse HEAD)" = "$PINNED_COMMIT"
          test "$(git -C "$SOURCE_DIR" rev-parse 'HEAD^{tree}')" = "$PINNED_ROOT_TREE"
          if git -C "$SOURCE_DIR" symbolic-ref -q HEAD; then exit 1; fi
          python3 eth_hai_repro/verify_source_snapshot.py \
            --repo "$SOURCE_DIR" \
            --manifest eth_hai_repro/git_object_snapshot_verified.json \
            --output-dir "$RESULTS_DIR/source"

      - name: Set up exact Python 3.8.16 runtime
        uses: actions/setup-python@v5
        with:
          python-version: 3.8.16
          architecture: x64

      - name: Recreate exact frozen analysis environment
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$VENV_DIR"
          source "$VENV_DIR/bin/activate"
          python -m pip install --disable-pip-version-check --no-input \
            pip==23.0.1 setuptools==67.1.0 wheel==0.38.4
          python -m pip install --disable-pip-version-check --no-input --no-deps \
            -r eth_hai_schema_gate/requirements-analysis-stack-33005830882.txt
          python -m pip check > "$RESULTS_DIR/pip-check.txt"
          python -m pip freeze --all | sort > "$RESULTS_DIR/requirements-freeze-observed.txt"
          diff -u eth_hai_schema_gate/requirements-freeze-expected-33005830882.txt \
            "$RESULTS_DIR/requirements-freeze-observed.txt" > "$RESULTS_DIR/environment-freeze-diff.txt"

      - name: Execute original H3 twice with display-only instrumentation
        shell: bash
        run: |
          set -euo pipefail
          source "$VENV_DIR/bin/activate"
          outdir="$RESULTS_DIR/runs/analysis_H3_new"
          sha256sum "$SOURCE_DIR/data_analysis/analysis_H3_new.py" > "$outdir/source-script-sha256.txt"
          sha256sum eth_hai_h3_display/sitecustomize.py > "$outdir/display-instrumentation-sha256.txt"
          printf '%s\n' 'PYTHONPATH=eth_hai_h3_display python analysis_H3_new.py' > "$outdir/command.txt"
          run_once() {
            local label="$1"
            set +e
            (
              cd "$SOURCE_DIR/data_analysis"
              PYTHONPATH="$GITHUB_WORKSPACE/eth_hai_h3_display" python analysis_H3_new.py
            ) > "$outdir/stdout-${label}.txt" 2> "$outdir/stderr-${label}.txt"
            local rc=$?
            set -e
            printf '%s\n' "$rc" > "$outdir/exit-code-${label}.txt"
          }
          run_once primary
          run_once repeat

      - name: Verify deterministic aggregate output and source cleanliness
        shell: bash
        run: |
          set -euo pipefail
          outdir="$RESULTS_DIR/runs/analysis_H3_new"
          test "$(cat "$outdir/exit-code-primary.txt")" = '0'
          test "$(cat "$outdir/exit-code-repeat.txt")" = '0'
          diff -u "$outdir/stdout-primary.txt" "$outdir/stdout-repeat.txt" > "$outdir/stdout-repeat-diff.txt"
          diff -u "$outdir/stderr-primary.txt" "$outdir/stderr-repeat.txt" > "$outdir/stderr-repeat-diff.txt"
          cp "$outdir/stdout-primary.txt" "$outdir/stdout.txt"
          cp "$outdir/stderr-primary.txt" "$outdir/stderr.txt"
          grep -q 'p-unc' "$outdir/stdout.txt"
          grep -q 'p-corr' "$outdir/stdout.txt"
          if grep -q 'Participant_' "$outdir/stdout.txt" "$outdir/stderr.txt"; then exit 1; fi
          git -C "$SOURCE_DIR" status --porcelain=v1 --untracked-files=all > "$RESULTS_DIR/source/source-post-run-status.txt"
          test ! -s "$RESULTS_DIR/source/source-post-run-status.txt"

      - name: Record metadata and integrity
        shell: bash
        run: |
          set -euo pipefail
          cp eth_hai_h3_display/sitecustomize.py "$RESULTS_DIR/sitecustomize.py"
          cp .github/workflows/eth-hai-direct-h3-display.yml "$RESULTS_DIR/workflow.yml"
          python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          r=Path(os.environ['RESULTS_DIR'])
          meta={
            'schema_version':'1.0',
            'captured_at_utc':datetime.now(timezone.utc).isoformat(),
            'github_run_id':int(os.environ['GITHUB_RUN_ID']),
            'github_orchestration_commit':os.environ['GITHUB_SHA'],
            'upstream_commit':os.environ['PINNED_COMMIT'],
            'python_runtime':'3.8.16',
            'frozen_environment_reused_exactly':True,
            'upstream_script_edited':False,
            'display_only_instrumentation':True,
            'statistical_specification_modified':False,
            'repeat_run_identical':True,
            'participant_level_data_in_artifact':False,
          }
          (r/'run-metadata.json').write_text(json.dumps(meta,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          PY
          find "$RESULTS_DIR" -type f ! -name RESULTS_MANIFEST.sha256 -print0 | sort -z | xargs -0 sha256sum > "$RESULTS_DIR/RESULTS_MANIFEST.sha256"

      - name: Upload display-expanded aggregate artifact
        uses: actions/upload-artifact@v4
        with:
          name: eth-hai-h3-display-${{ github.run_id }}
          path: work/h3_display_results
          if-no-files-found: error
          retention-days: 30
          compression-level: 9
